services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vehicle-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      user:
        condition: service_healthy
      vehicle:
        condition: service_healthy
    networks:
      - edge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - edge
    restart: unless-stopped
    mem_limit: 100m

  user:
    build:
      context: ./backend
      dockerfile: ./apps/user/Dockerfile
    env_file:
      - ./backend/.env
    command: sh -c "npm run migration:run:prod && npm run start:user"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m

  vehicle:
    build:
      context: ./backend
      dockerfile: ./apps/vehicle/Dockerfile
    env_file:
      - ./backend/.env
    command: npm run start:vehicle
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m

  postgres:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 150m

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 50m

  rabbitmq:
    image: rabbitmq:3.13-management
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 200m

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  edge:
    driver: bridge

  backend:
    driver: bridge