events {}

http {
    upstream frontend {
        server frontend:80;
    }

    upstream user {
        server user:5000;
    }

    upstream vehicle {
        server vehicle:5001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend;
        }

        location /api/user/ {
            proxy_pass http://user/;
        }

        location /api/vehicle/ {
            proxy_pass http://vehicle/;
        }
    }
}