services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      user:
        condition: service_healthy
      vehicle:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    networks:
      - edge
    restart: unless-stopped
    mem_limit: 100m

  user:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_NAME: user
    ports:
      - "4000:5000"
    env_file:
      - ../backend/.env
      - ../backend/.env.secrets
    environment:
      - IS_DOCKER=true
    command: sh -c "npm run migration:user:run:prod && npm run start:user"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m

  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_NAME: auth
    ports:
      - "4002:5002"
    env_file:
      - ../backend/.env
      - ../backend/.env.secrets
    environment:
      IS_DOCKER: "true"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5002/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m

  storage:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_NAME: storage
    ports:
      - "4003:5003"
    extra_hosts:
      - "s3.localhost.localstack.cloud:host-gateway"
    env_file:
      - ../backend/.env
      - ../backend/.env.secrets
    environment:
      - IS_DOCKER=true
    command: sh -c "npm run migration:storage:run:prod && npm run start:storage"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5003/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m

  vehicle:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_NAME: vehicle
    ports:
      - "4001:5001"
    env_file:
      - ../backend/.env
      - ../backend/.env.secrets
    environment:
      - IS_DOCKER=true
    command: sh -c "npm run migration:vehicle:run:prod && npm run start:vehicle"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5001/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 100m
