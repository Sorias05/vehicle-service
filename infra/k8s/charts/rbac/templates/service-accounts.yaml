{{- range $accountKey, $account := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required (printf "serviceAccounts.%s.name is required" $accountKey) $account.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "rbac.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
