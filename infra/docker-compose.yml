name: ${PROJECT_NAME}

services:
  postgres:
    image: postgres:15
    env_file:
      - .env
      - .env.secrets
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 150m

  redis:
    image: redis:7-alpine
    env_file:
      - .env
      - .env.secrets
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 50m

  rabbitmq:
    image: rabbitmq:3.13-management
    env_file:
      - .env
      - .env.secrets
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test:
        ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "5672"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 200m

  localstack:
    image: localstack/localstack:2026.7.5
    env_file:
      - .env
      - .env.secrets
    ports:
      - "${LOCALSTACK_HOST_PORT}:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
      - edge
    restart: unless-stopped
    mem_limit: 512m

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    env_file:
      - .env
      - .env.secrets
    ports:
      - "${JAEGER_HOST_PORT}:16686"
    environment:
      OTEL_TRACES_SAMPLER: always_off
    networks:
      - backend
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    env_file:
      - .env
      - .env.secrets
    command:
      - "--config=/etc/otelcol/config.yaml"
    volumes:
      - ./o11y/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_HOST_PORT}:4317"
      - "${OTEL_HTTP_HOST_PORT}:4318"
    networks:
      - backend
    depends_on:
      - jaeger
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
